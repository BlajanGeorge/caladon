spring:
  application:
    name: caladon
  datasource:
    url: ${CALADON_DB_URL:jdbc:postgresql://localhost:5433/caladon}
    username: ${CALADON_DB_USER:caladon}
    password: ${CALADON_DB_PASSWORD:caladon}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

caladon:
  jwt:
    # Override in every non-local environment. Must be at least 32 bytes.
    secret: ${CALADON_JWT_SECRET:dev-only-secret-change-me-before-deploying-anywhere}
    access-token-ttl: 1h
    refresh-token-ttl: 7d
